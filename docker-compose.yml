services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      - db
      - redis
    volumes:
      - ./src:/var/www
      - laravel_framework_views:/var/www/storage/framework/views
      - laravel_framework_cache:/var/www/storage/framework/cache
      - laravel_framework_sessions:/var/www/storage/framework/sessions
      - laravel_bootstrap_cache:/var/www/bootstrap/cache
    working_dir: /var/www
    networks:
      - uniph

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db
    networks:
      - uniph

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --queue=votaciones,whatsapp,default --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    depends_on:
      - app
      - db
      - redis
    volumes:
      - ./src:/var/www
      - laravel_framework_views:/var/www/storage/framework/views
      - laravel_framework_cache:/var/www/storage/framework/cache
      - laravel_framework_sessions:/var/www/storage/framework/sessions
      - laravel_bootstrap_cache:/var/www/bootstrap/cache
    working_dir: /var/www
    networks:
      - uniph

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uniph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - uniph

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - uniph

volumes:
  pg_data:
  laravel_framework_views:
  laravel_framework_cache:
  laravel_framework_sessions:
  laravel_bootstrap_cache:

networks:
  uniph:

