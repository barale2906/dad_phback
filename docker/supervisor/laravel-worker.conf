[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d

; ── Ruta ──────────────────────────────────────────────────────────────────────
; Reemplazar /home/USUARIO/web/DOMINIO por la ruta real en HestiaCP.
; Ejemplo: /home/uniph/web/api.mi-ph.com/artisan
;
; Flags importantes:
;   --queue        prioridad: votaciones > whatsapp > default
;   --sleep=3      pausa entre polls cuando la cola está vacía
;   --tries=3      reintentos antes de marcar el job como fallido
;   --timeout=60   mata un job que lleve más de 60s (protege contra llamadas HTTP colgadas)
;   --max-time=3600 reinicia el worker cada hora (previene memory leaks)
command=php /home/USUARIO/web/DOMINIO/artisan queue:work redis --queue=votaciones,whatsapp,default --sleep=3 --tries=3 --timeout=60 --max-time=3600

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; En HestiaCP cada dominio corre bajo su propio usuario Linux.
; Reemplazar USUARIO por el usuario del dominio en HestiaCP.
user=USUARIO

; ── Número de procesos ────────────────────────────────────────────────────────
; Referencia según RAM disponible del servidor (compartido con otros proyectos):
;   VPS  2 GB  → numprocs=3
;   VPS  4 GB  → numprocs=5
;   VPS 12 GB  → numprocs=8  ← configuración actual (6 cores, 12 GB, compartido)
;   Tope real  → numprocs=24 (límite rate: 80 req/s de Meta API)
numprocs=8

; ── Logs con rotación ─────────────────────────────────────────────────────────
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Debe ser >= --max-time para dar tiempo al worker de terminar limpiamente
stopwaitsecs=3600
